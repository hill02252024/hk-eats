<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img"
     aria-labelledby="svg-gr-title svg-gr-desc" class="diagram-svg">
  <title id="svg-gr-title">錐刀與平刀剖面對比，以及定位機構的差別</title>
  <desc id="svg-gr-desc">上半部為兩種刀盤的剖面示意。左邊錐刀：一個圓錐體轉於中空錐座之中，豆由頂部靠重力向下帶，通道逐漸收窄，所需扭力較細。右邊平刀：兩塊平行圓盤，豆由中心入，被離心力甩向外緣，於邊緣最窄處排出，所需扭力較大。下半部為定位機構對比：單軸承的中軸受力時會偏擺，令刀盤間隙時闊時窄；雙軸承上下分置，中軸維持同心，間隙穩定。</desc>

  <!-- ================= 上半：刀盤剖面 ================= -->
  <text class="d-section" x="24" y="30" font-size="14" font-weight="700">一、刀盤剖面：豆點樣被帶入收窄通道</text>

  <!-- 左：錐刀 -->
  <g>
    <text class="d-title" x="190" y="60" font-size="13.5" font-weight="700" text-anchor="middle">錐刀（conical）</text>

    <!-- 豆與落下方向 -->
    <circle class="d-bean" cx="164" cy="88" r="7" stroke-width="1.4"/>
    <circle class="d-bean" cx="190" cy="80" r="6" stroke-width="1.4"/>
    <circle class="d-bean" cx="216" cy="88" r="7" stroke-width="1.4"/>
    <path class="d-arrow" d="M190 100 L190 118" stroke-width="2"/>
    <path class="d-arrow" d="M184 112 L190 120 L196 112" stroke-width="2" fill="none"/>
    <text class="d-note" x="252" y="96" font-size="11">重力幫手</text>

    <!-- 錐座（外環）左右兩片 -->
    <path class="d-burr" d="M96 128 L146 128 L176 258 L146 268 Z" stroke-width="1.8"/>
    <path class="d-burr" d="M284 128 L234 128 L204 258 L234 268 Z" stroke-width="1.8"/>
    <!-- 內錐 -->
    <path class="d-burr d-burr-inner" d="M190 132 L200 250 L180 250 Z" stroke-width="1.8"/>
    <!-- 收窄通道標示 -->
    <path class="d-gap" d="M176 258 L204 258" stroke-width="2.5"/>
    <text class="d-gap-text" x="190" y="286" font-size="11" text-anchor="middle">出口間隙</text>
    <text class="d-note" x="190" y="304" font-size="11" text-anchor="middle">＝ 決定粗細嘅唯一變數</text>

    <!-- 通道收窄提示 -->
    <text class="d-note" x="72" y="196" font-size="11" text-anchor="middle">通道</text>
    <text class="d-note" x="72" y="212" font-size="11" text-anchor="middle">逐漸收窄</text>
    <path class="d-tick" d="M100 196 L138 196" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>

  <!-- 分隔 -->
  <line class="d-divider" x1="380" y1="52" x2="380" y2="312" stroke-width="1.2" stroke-dasharray="6 5"/>

  <!-- 右：平刀 -->
  <g>
    <text class="d-title" x="570" y="60" font-size="13.5" font-weight="700" text-anchor="middle">平刀（flat）</text>

    <circle class="d-bean" cx="570" cy="84" r="7" stroke-width="1.4"/>
    <path class="d-arrow" d="M570 96 L570 138" stroke-width="2"/>
    <path class="d-arrow" d="M564 132 L570 140 L576 132" stroke-width="2" fill="none"/>
    <text class="d-note" x="596" y="112" font-size="11">由中心入</text>

    <!-- 上盤 -->
    <rect class="d-burr" x="440" y="146" width="110" height="26" rx="3" stroke-width="1.8"/>
    <rect class="d-burr" x="590" y="146" width="110" height="26" rx="3" stroke-width="1.8"/>
    <!-- 下盤 -->
    <rect class="d-burr d-burr-inner" x="440" y="196" width="110" height="26" rx="3" stroke-width="1.8"/>
    <rect class="d-burr d-burr-inner" x="590" y="196" width="110" height="26" rx="3" stroke-width="1.8"/>

    <!-- 離心方向 -->
    <path class="d-arrow" d="M556 184 L452 184" stroke-width="2"/>
    <path class="d-arrow" d="M460 178 L450 184 L460 190" stroke-width="2" fill="none"/>
    <path class="d-arrow" d="M584 184 L688 184" stroke-width="2"/>
    <path class="d-arrow" d="M680 178 L690 184 L680 190" stroke-width="2" fill="none"/>
    <text class="d-note" x="570" y="188" font-size="11" text-anchor="middle">離心力</text>

    <!-- 邊緣最窄 -->
    <path class="d-gap" d="M440 176 L440 192" stroke-width="2.5"/>
    <path class="d-gap" d="M700 176 L700 192" stroke-width="2.5"/>
    <text class="d-gap-text" x="570" y="252" font-size="11" text-anchor="middle">最窄處喺外緣</text>
    <text class="d-note" x="570" y="270" font-size="11" text-anchor="middle">豆要行完固定寬度先出得嚟</text>
    <text class="d-note" x="570" y="292" font-size="11" text-anchor="middle">→ 粒徑分佈較集中，但扭力大好多</text>
  </g>

  <!-- ================= 下半：定位機構 ================= -->
  <line class="d-divider" x1="24" y1="332" x2="736" y2="332" stroke-width="1.2"/>
  <text class="d-section" x="24" y="358" font-size="14" font-weight="700">二、定位機構：同一副刀盤，晃唔晃決定粒徑分佈闊唔闊</text>

  <!-- 單軸承 -->
  <g>
    <text class="d-title" x="190" y="386" font-size="12.5" font-weight="700" text-anchor="middle">單軸承／塑膠軸套</text>
    <!-- 機身 -->
    <rect class="d-body" x="96" y="396" width="188" height="58" rx="6" stroke-width="1.6"/>
    <!-- 中軸（傾斜） -->
    <path class="d-shaft d-shaft-bad" d="M190 396 L204 454" stroke-width="3"/>
    <!-- 軸承 -->
    <circle class="d-bearing" cx="193" cy="410" r="7" stroke-width="1.8"/>
    <!-- 偏擺箭頭 -->
    <path class="d-arrow d-arrow-bad" d="M214 430 L232 424" stroke-width="2"/>
    <path class="d-arrow d-arrow-bad" d="M214 442 L232 448" stroke-width="2"/>
    <text class="d-warn" x="300" y="430" font-size="11">受力偏擺</text>
    <text class="d-warn" x="300" y="447" font-size="11">間隙時闊時窄</text>
  </g>

  <!-- 雙軸承 -->
  <g>
    <text class="d-title" x="570" y="386" font-size="12.5" font-weight="700" text-anchor="middle">雙軸承，上下分置</text>
    <rect class="d-body" x="476" y="396" width="188" height="58" rx="6" stroke-width="1.6"/>
    <path class="d-shaft d-shaft-good" d="M570 396 L570 454" stroke-width="3"/>
    <circle class="d-bearing" cx="570" cy="408" r="7" stroke-width="1.8"/>
    <circle class="d-bearing" cx="570" cy="442" r="7" stroke-width="1.8"/>
    <text class="d-ok" x="680" y="430" font-size="11">維持同心</text>
    <text class="d-ok" x="680" y="447" font-size="11">間隙穩定</text>
  </g>
</svg>
